name: Decision CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: flamoris-jp/Maidionis
          ref: 09b119f4315c5742d075e63669daabe5d0fc55ac
          path: dependencies/Maidionis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned CPU reference dependencies
        run: |
          python -m pip install -r dependencies/Maidionis/tools/dependencies.txt
          python -m pip install numpy==2.1.3
          python -m pip install --no-deps --no-build-isolation dependencies/Maidionis
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Native and Python acceptance
        run: python tools/verify.py --maidionis-root dependencies/Maidionis
      - name: Actual train export admitted load evaluate and finalize
        run: python tools/run_experiments.py --output runs/ci-smoke --smoke
